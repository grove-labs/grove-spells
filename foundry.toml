[profile.default]
src = "src"
test = "src"
out = "out"
libs = ["lib"]
# Remappings are pinned explicitly because forge's auto-detection is not stable across
# versions: 1.8 resolves @openzeppelin and @layerzerolabs into unrelated submodule trees
# and gives xchain-helpers its own forge-std, which splits StdChains.Chain into two types.
remappings = [
    "@layerzerolabs/lz-evm-messagelib-v2/=lib/xchain-helpers/lib/LayerZero-v2/packages/layerzero-v2/evm/messagelib/",
    "@layerzerolabs/lz-evm-protocol-v2/=lib/xchain-helpers/lib/LayerZero-v2/packages/layerzero-v2/evm/protocol/",
    "@layerzerolabs/oft-evm/=lib/xchain-helpers/lib/devtools/packages/oft-evm/",
    "@openzeppelin/contracts-upgradeable/=lib/grove-alm-controller/lib/sdai/lib/openzeppelin-contracts-upgradeable/contracts/",
    "@openzeppelin/contracts/=lib/xchain-helpers/lib/openzeppelin-contracts/contracts/",
    "LayerZero-v2/=lib/grove-gov-relay/lib/",
    "aave-v3-core/=lib/grove-alm-controller/lib/aave-v3-origin/src/core/",
    "aave-v3-origin/=lib/grove-alm-controller/lib/aave-v3-origin/",
    "aave-v3-periphery/=lib/grove-alm-controller/lib/aave-v3-origin/src/periphery/",
    "devtools/=lib/xchain-helpers/lib/devtools/packages/toolbox-foundry/src/",
    "diamond-pau/=lib/diamond-pau/src/",
    "ds-test/=lib/grove-address-registry/lib/forge-std/lib/ds-test/src/",
    "dss-allocator/=lib/dss-allocator/",
    "dss-interfaces/=lib/dss-allocator/lib/dss-test/lib/dss-interfaces/src/",
    "dss-test/=lib/dss-allocator/lib/dss-test/src/",
    "erc20-helpers/=lib/grove-alm-controller/lib/erc20-helpers/src/",
    "erc4626-tests/=lib/xchain-helpers/lib/openzeppelin-contracts/lib/erc4626-tests/",
    "forge-std/=lib/forge-std/src/",
    "grove-address-registry/=lib/grove-address-registry/src/",
    "grove-alm-controller/=lib/grove-alm-controller/",
    "grove-gov-relay/=lib/grove-gov-relay/",
    "layerzero-v2/=lib/grove-alm-controller/lib/",
    "layerzerolabs/oapp-evm/=lib/xchain-helpers/lib/devtools/packages/oapp-evm/",
    "metamorpho/=lib/grove-alm-controller/lib/metamorpho/src/",
    "morpho-blue/=lib/grove-alm-controller/lib/metamorpho/lib/morpho-blue/",
    "murky/=lib/grove-alm-controller/lib/metamorpho/lib/universal-rewards-distributor/lib/murky/src/",
    "openzeppelin-contracts-upgradeable/=lib/grove-alm-controller/lib/sdai/lib/openzeppelin-contracts-upgradeable/",
    "openzeppelin-contracts/=lib/xchain-helpers/lib/openzeppelin-contracts/",
    "openzeppelin-foundry-upgrades/=lib/grove-alm-controller/lib/sdai/lib/openzeppelin-foundry-upgrades/src/",
    "openzeppelin/=lib/grove-alm-controller/lib/metamorpho/lib/universal-rewards-distributor/lib/openzeppelin-contracts/contracts/",
    "pas/=lib/pas/src/",
    "sdai/=lib/grove-alm-controller/lib/sdai/",
    "solidity-bytes-utils/=lib/xchain-helpers/lib/solidity-bytes-utils/",
    "solidity-stringutils/=lib/grove-alm-controller/lib/sdai/lib/openzeppelin-foundry-upgrades/lib/solidity-stringutils/",
    "solidity-utils/=lib/grove-alm-controller/lib/aave-v3-origin/lib/solidity-utils/",
    "spark-address-registry/=lib/spark-address-registry/src/",
    "spark-psm/=lib/grove-alm-controller/lib/spark-psm/",
    "sparklend-address-registry/=lib/grove-alm-controller/lib/spark-psm/lib/xchain-ssr-oracle/lib/sparklend-address-registry/",
    "token-tests/=lib/grove-alm-controller/lib/sdai/lib/token-tests/src/",
    "universal-rewards-distributor/=lib/grove-alm-controller/lib/metamorpho/lib/universal-rewards-distributor/src/",
    "usds/=lib/grove-alm-controller/lib/usds/",
    "xchain-helpers/=lib/xchain-helpers/src/",
    "xchain-ssr-oracle/=lib/grove-alm-controller/lib/spark-psm/lib/xchain-ssr-oracle/",
]
fs_permissions = [
    { access = "read", path = "./out" },
    { access = "write", path = "./reports" },
    { access = "read-write", path = "./cache/fork-blocks" }
]
solc = "0.8.34"
ffi = true
evm_version = "cancun"
bytecode_hash = "none"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
