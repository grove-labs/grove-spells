name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  test:
    strategy:
      fail-fast: true

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check foundry.lock matches submodule revisions
        run: |
          status=0
          while read -r path rev; do
            actual=$(git -C "$path" rev-parse HEAD)
            if [ "$actual" != "$rev" ]; then
              echo "::error::$path is checked out at $actual but foundry.lock pins $rev"
              status=1
            fi
          done < <(jq -r 'to_entries[] | "\(.key) \(.value.rev)"' foundry.lock)
          while read -r path; do
            if ! jq -e --arg p "$path" 'has($p)' foundry.lock > /dev/null; then
              echo "::error::submodule $path has no foundry.lock entry"
              status=1
            fi
          done < <(git config --file .gitmodules --get-regexp path | awk '{print $2}')
          exit $status

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned deliberately: forge 1.8 changed remapping auto-detection and breaks this
          # dependency graph. Bump only with a verified build.
          version: v1.7.1

      - name: Run Forge build
        run: |
          forge --version
          forge build
        id: build

      - name: Run Forge tests
        env:
          ETHERSCAN_API_KEY: ${{secrets.ETHERSCAN_API_KEY}}
          MAINNET_RPC_URL: ${{secrets.MAINNET_RPC_URL}}
          PLUME_RPC_URL: ${{secrets.PLUME_RPC_URL}}
          ROBINHOOD_RPC_URL: ${{secrets.ROBINHOOD_RPC_URL}}
        run: |
          forge test -vvv
        id: test
